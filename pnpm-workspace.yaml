packages:
  - 'apps/*'
  - 'packages/*'

minimumReleaseAge: 2880

catalog:
  '@playwright/test': 1.64.1
  '@sveltejs/adapter-cloudflare': ^8.0.0
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@typescript/native': npm:typescript@^7.0.2
  '@vitest/browser-playwright': 5.1.0
  '@vitest/coverage-v8': 5.1.0
  playwright: 1.64.1
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.943ee4a9e322a7ad4b1b4113f844cd541a10b159
  vite-plus: 0.0.0-commit.943ee4a9e322a7ad4b1b4113f844cd541a10b159
  vitest: 5.1.0
  vitest-browser-svelte: ^3.1.0
  wrangler: ^4.118.0

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowedVersions:
    # Vite+ core exposes Vite 8 APIs but uses Vite+'s package version.
    vite: '*'
    vitest: '*'
  allowAny:
    - vite
    - vitest
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tsdown
  - '@tsdown/*'
  - rolldown
  - '@rolldown/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
